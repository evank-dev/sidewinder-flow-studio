# Desktop edition: build the installers on every platform and smoke-test them.
#
#   Run manually (Actions → Desktop → Run workflow): installers are attached
#   to the run as artifacts.
#   Push a tag v*: the same, and the installers go to a DRAFT GitHub release
#   for that tag (unsigned until Phase 2), which you publish by hand.
#
# Each job freezes the backend with PyInstaller, smoke-tests the frozen
# backend, builds the Tauri app around it, then smoke-tests the copy of the
# backend inside the built app (catches resource-copy problems).
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # create the draft release on tags

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (AppImage, deb)
            os: ubuntu-22.04          # oldest supported glibc, so the AppImage runs on more distros
            backend: desktop/src-tauri/target/release/bundle/deb/*/data/usr/lib/*/sfs-backend/sfs-backend
            bundles: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows x64 (NSIS, MSI)
            os: windows-2022
            backend: desktop/src-tauri/target/release/sfs-backend/sfs-backend.exe
            bundles: desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS arm64 (DMG)
            os: macos-14
            backend: desktop/src-tauri/target/release/bundle/macos/*.app/Contents/Resources/sfs-backend/sfs-backend
            bundles: desktop/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Version files agree
        if: runner.os == 'Linux'
        run: bash scripts/check_version.sh

      - name: Tag matches the app version
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          [ "$tag" = "$want" ] || [ "$tag.0" = "$want" ] || { echo "tag $GITHUB_REF_NAME != app $want"; exit 1; }

      # ── system packages ──
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── frontend ──
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── backend sidecar ──
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install the backend, bundled plugins and PyInstaller
        run: python -m pip install "./backend[pushdown]" ./plugins/sfs-plugin-curvefit pyinstaller pytest
      - name: Desktop launcher tests (handshake, data directory)
        working-directory: backend
        run: python -m pytest -q tests/test_desktop.py
      - name: Freeze the backend
        working-directory: desktop/sidecar
        run: pyinstaller --noconfirm sfs-backend.spec
      - name: Smoke test the frozen backend
        working-directory: desktop/sidecar
        shell: bash
        run: python smoke_test.py dist/sfs-backend/sfs-backend$([ "$RUNNER_OS" = Windows ] && echo .exe)

      # ── desktop app ──
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci
      - name: Build the app and installers
        working-directory: desktop
        run: npx tauri build

      - name: Smoke test the backend inside the built app
        shell: bash
        run: |
          exe="$(python -c "import glob,sys; m=glob.glob(sys.argv[1]); print(m[0] if m else '')" '${{ matrix.backend }}')"
          [ -n "$exe" ] || { echo "backend not found in the built app"; exit 1; }
          python desktop/sidecar/smoke_test.py "$exe"

      - name: Collect the installers
        shell: bash
        run: |
          mkdir out
          for f in ${{ matrix.bundles }}; do cp "$f" "out/$(basename "$f" | tr ' ' '-')"; done
          ls -l out

      # ── publish ──
      - uses: actions/upload-artifact@v4
        with:
          name: sfs-desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          compression-level: 0        # installers are already compressed
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "Desktop installers (unsigned). Release notes to follow." ||
            gh release view "$GITHUB_REF_NAME" >/dev/null   # another job created it meanwhile
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
