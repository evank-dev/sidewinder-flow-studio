<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidewinder Flow Studio</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0d14;
         color: #cbd5e1; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; padding: 24px; text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 18px; display: grid; place-items: center;
          background: linear-gradient(135deg, #38bdf8, #2563eb); color: #0b0d14; font-weight: 700; }
  .spinner { width: 22px; height: 22px; margin: 16px auto 0; border: 3px solid #334155; border-top-color: #38bdf8;
             border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { display: none; text-align: left; background: #1e1b2e; border: 1px solid #7f1d1d; border-radius: 10px;
           padding: 14px 16px; color: #fecaca; white-space: pre-wrap; font-size: 13px; }
  body.failed .spinner, body.failed #status { display: none; }
  body.failed #error { display: block; }
</style>
</head>
<body>
<main>
  <div class="logo">FS</div>
  <div id="status">Starting Sidewinder Flow Studio…</div>
  <div class="spinner" aria-hidden="true"></div>
  <div id="error" role="alert"></div>
</main>
<script>
  // Called by the shell when the backend fails to start.
  window.sfsShowError = (message) => {
    document.getElementById("error").textContent = message;
    document.body.classList.add("failed");
  };
</script>
</body>
</html>
