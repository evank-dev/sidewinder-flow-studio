[package]
name = "sfs-desktop"
version = "1.30.0"
description = "Sidewinder Flow Studio — desktop edition"
authors = ["Sidewinder Labs"]
license = "AGPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
